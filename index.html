<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BT VIDEO — Rent Malawian Movies</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.0/dist/umd/supabase.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px 64px;
      background-color: #ffffff;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 28px;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header p {
      margin: 0;
      font-size: 0.95rem;
      color: #4b5563;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 24px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .movie-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      background: #ffffff;
    }

    .poster-frame {
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 8px;
      overflow: hidden;
      background-color: #f3f4f6;
      margin-bottom: 12px;
      position: relative;
    }

    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .poster-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
      font-size: 0.875rem;
      font-weight: 700;
      color: #111827;
    }

    .movie-title {
      margin: 0 0 4px;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      color: #111827;
    }

    .movie-meta {
      margin: 0 0 12px;
      font-size: 0.8rem;
      color: #6b7280;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 9px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    .btn-rent {
      background-color: #16a34a;
      color: #ffffff;
    }

    .btn-trailer {
      background-color: #dc2626;
      color: #ffffff;
    }

    .btn-disabled {
      background-color: #e5e7eb;
      color: #6b7280;
      cursor: not-allowed;
    }

    .status-text {
      font-size: 0.9rem;
      color: #4b5563;
      padding: 16px 0;
    }

    .error-text {
      font-size: 0.9rem;
      color: #b91c1c;
      padding: 16px 0;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      color: #111827;
      border-radius: 12px;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .modal-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .close-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .modal-status {
      margin: 0;
      font-size: 0.8rem;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>BT VIDEO</h1>
      <p>Rent Malawian Movies</p>
    </header>

    <ul id="movie-grid" class="movie-grid">
      <li class="status-text">Loading movies...</li>
    </ul>
  </div>

  <!-- Protected Stream Modal (triggered when returning with ?tx_ref=...) -->
  <div id="stream-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="stream-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="stream-modal-title" class="modal-title">Now Playing</h2>
        <button type="button" class="close-btn" onclick="closeStreamModal()">Close</button>
      </div>
      <video id="stream-player" class="modal-video" controls playsinline></video>
      <p id="stream-status" class="modal-status">Verifying payment...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://aqyypmswkyffnpsmqfwm.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxeXlwbXN3a3lmZm5wc21xZndtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDQ1MDUsImV4cCI6MjA5ODkyMDUwNX0.-0BF0z0l2aLF4nLc5qUWlAV7ypfwlGnMAtnX3--rEKo";
    const STREAM_ENDPOINT = "https://paychangu-webhook.xmradiomalawi.workers.dev/stream";

    let supabaseClient = null;
    let moviesCache = [];

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatRentPrice(price) {
      if (price === null || price === undefined || price === "") {
        return "Rent";
      }
      const num = Number(price);
      if (!Number.isNaN(num)) {
        return `Rent : $${num.toFixed(2)}`;
      }
      return `Rent : ${escapeHtml(price)}`;
    }

    function renderMovies(items) {
      const grid = document.getElementById("movie-grid");

      if (!items || items.length === 0) {
        grid.innerHTML = `<li class="status-text">No movies available yet.</li>`;
        return;
      }

      grid.innerHTML = items.map((movie) => {
        const title = escapeHtml(movie.title || "Untitled");
        const genre = escapeHtml(movie.Genre || "");
        const language = escapeHtml(movie.Language || "");
        const metaText = [genre, language].filter(Boolean).join(" • ") || "Film";
        const rentLabel = formatRentPrice(movie.rent_price);
        const hasThumb = Boolean(movie.thumbnail_url && String(movie.thumbnail_url).trim());
        const thumbUrl = hasThumb ? escapeHtml(String(movie.thumbnail_url).trim()) : "";

        const rentButton = movie.paychangu_link
          ? `<a href="${escapeHtml(movie.paychangu_link)}" target="_blank" rel="noopener noreferrer" class="action-btn btn-rent">${rentLabel}</a>`
          : `<span class="action-btn btn-disabled">${rentLabel}</span>`;

        const trailerButton = movie.Trailer
          ? `<a href="${escapeHtml(movie.Trailer)}" target="_blank" rel="noopener noreferrer" class="action-btn btn-trailer">&#9654; Trailer</a>`
          : `<span class="action-btn btn-disabled">&#9654; Trailer</span>`;

        return `
          <li class="movie-card">
            <div>
              <div class="poster-frame">
                ${hasThumb
                  ? `<img src="${thumbUrl}" alt="${title}" class="poster-img" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" /><div class="poster-fallback" style="display:none;">${title}</div>`
                  : `<div class="poster-fallback">${title}</div>`
                }
              </div>
              <h2 class="movie-title">${title}</h2>
              <p class="movie-meta">${metaText}</p>
            </div>
            <div class="card-actions">
              ${rentButton}
              ${trailerButton}
            </div>
          </li>
        `;
      }).join("");
    }

    function openStreamModal(movie, txRef) {
      if (!movie || !txRef) return;
      document.getElementById("stream-modal-title").textContent = movie.title || "Now Playing";
      const statusEl = document.getElementById("stream-status");
      const player = document.getElementById("stream-player");
      const url = `${STREAM_ENDPOINT}?movie_id=${encodeURIComponent(movie.id)}&tx_ref=${encodeURIComponent(txRef)}`;

      statusEl.textContent = "Verifying payment and loading stream...";
      player.src = url;
      player.load();
      document.getElementById("stream-modal").classList.add("open");

      player.play().then(() => {
        statusEl.textContent = "Playing stream.";
      }).catch(() => {
        statusEl.textContent = "Stream ready — press play to start.";
      });
    }

    function closeStreamModal() {
      const player = document.getElementById("stream-player");
      player.pause();
      player.removeAttribute("src");
      player.load();
      document.getElementById("stream-modal").classList.remove("open");
    }

    async function loadCatalog() {
      const grid = document.getElementById("movie-grid");

      try {
        const lib = window.supabase || window.supabaseJS;
        if (!lib) throw new Error("Supabase SDK failed to load.");

        supabaseClient = lib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const { data, error } = await supabaseClient
          .from("movies")
          .select('id, title, "Genre", thumbnail_url, video_url, rent_price, "Language", "Trailer", paychangu_link');

        if (error) throw error;

        moviesCache = data || [];
        renderMovies(moviesCache);

        const params = new URLSearchParams(window.location.search);
        const returnTxRef = params.get("tx_ref") || params.get("reference");
        const returnMovieId = params.get("movie_id") || params.get("key");
        if (returnTxRef && moviesCache.length > 0) {
          const matched = returnMovieId
            ? moviesCache.find((m) => String(m.id) === String(returnMovieId) || String(m.title) === String(returnMovieId))
            : moviesCache[0];
          if (matched) {
            openStreamModal(matched, returnTxRef);
          }
        }
      } catch (err) {
        console.error("Failed to load movies:", err);
        grid.innerHTML = `<li class="error-text">Could not load movies. Check Supabase public read policy on movies.</li>`;
      }
    }

    loadCatalog();
  </script>
</body>
</html>
