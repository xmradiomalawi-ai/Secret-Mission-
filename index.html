    <!-- Swebsy color mode bootstrap -->
    <style>
      html.light {
        background: #ffffff;
        color: #1f2937;
        color-scheme: light;
      }

      html.dark {
        background: #030712;
        color: #f3f4f6;
        color-scheme: dark;
      }

      .bt-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 28px;
      }

      .bt-search {
        width: 100%;
        max-width: 320px;
        padding: 9px 14px;
        border: 1px solid currentColor;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font-size: 0.9rem;
      }

      .bt-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .bt-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: 1px solid currentColor;
      }

      .bt-btn-rent {
        background: #16a34a;
        border-color: #16a34a;
        color: #ffffff;
      }

      .bt-btn-trailer {
        background: #dc2626;
        border-color: #dc2626;
        color: #ffffff;
      }

      .bt-btn-watch {
        background: transparent;
        color: inherit;
      }

      .bt-poster-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        text-align: center;
        font-size: 0.875rem;
        font-weight: 600;
      }

      .bt-modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 50;
      }

      .bt-modal-backdrop.open {
        display: flex;
      }

      .bt-modal-box {
        width: 100%;
        max-width: 560px;
        background: #ffffff;
        color: #111827;
        border: 2px solid #111827;
        padding: 20px;
      }
    </style>
    <script>
      (function () {
        var storageKey = "swebsy:color-mode";
        var defaultMode = "light";
        var root = document.documentElement;
        function normalize(mode) {
          return mode === "light" || mode === "dark" || mode === "system"
            ? mode
            : null;
        }
        function readStoredMode() {
          try {
            return normalize(
              window.localStorage && window.localStorage.getItem(storageKey),
            );
          } catch (_) {
            return null;
          }
        }
        function systemMode() {
          return window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        function resolve(mode) {
          return mode === "system" ? systemMode() : mode;
        }
        var resolved = resolve(readStoredMode() || defaultMode);
        root.classList.remove("light", "dark");
        root.classList.add(resolved);
        root.style.colorScheme = resolved;
      })();
    </script>
    <!-- CSS Link -->
    <link rel="stylesheet" href="./css/main-home.css" />
  </head>

  <body>
    <section
      id="sets"
      data-swebsy-block-id="priced-rail"
      data-swebsy-block='{"tags":["gallery","pricing"],"description":"A mid-grey band of six tall photo frames, each captioned with its name, a large serif total, the parts it adds up from and the time.","title":"Six priced work frames"}'
      class="rail-band py-16 md:py-24"
    >
      <div
        data-animate-trigger="scroll"
        class="container mx-auto max-w-7xl px-4 md:px-8 animate-soft-reveal-up"
      >
        <h2
          class="font-serif text-[2.25rem] md:text-[3.25rem] leading-[1] tracking-[-0.015em] mb-3"
          id="i8ggb"
        >
          BT VIDEO
        </h2>
        <p
          class="text-[1rem] leading-[1.5] text-default mb-6 max-w-[34rem]"
          id="iqihi"
        >
          Rent Malawian Movies
        </p>

        <div class="bt-toolbar">
          <input
            type="search"
            id="movie-search"
            class="bt-search"
            placeholder="Search by title, genre, or language..."
            oninput="handleMovieSearch(this.value)"
          />
          <span id="catalog-status" class="text-sm text-muted">Loading movies...</span>
        </div>

        <ul
          id="movie-grid"
          class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-x-4 gap-y-12 xl:gap-x-5 list-none p-0 m-0"
        ></ul>
      </div>
    </section>

    <!-- Protected Stream Modal -->
    <div id="stream-modal" class="bt-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="stream-modal-title">
      <div class="bt-modal-box">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;">
          <h3 id="stream-modal-title" style="margin:0;font-size:1.125rem;font-weight:700;">Watch Movie</h3>
          <button type="button" onclick="closeStreamModal()" class="bt-btn bt-btn-watch">Close</button>
        </div>

        <video
          id="stream-player"
          controls
          playsinline
          style="width:100%;aspect-ratio:16/9;background:#000000;margin-bottom:12px;"
        ></video>

        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <input
            type="text"
            id="tx-ref-input"
            placeholder="Enter PayChangu tx_ref to stream..."
            style="flex:1;min-width:200px;padding:8px 12px;border:1px solid #111827;border-radius:6px;font-size:0.875rem;"
          />
          <button type="button" onclick="unlockAndPlayStream()" class="bt-btn bt-btn-rent">Play Stream</button>
        </div>

        <p id="stream-status" style="margin:10px 0 0;font-size:0.8125rem;color:#4b5563;">
          Enter a verified PayChangu transaction reference (tx_ref) to stream this movie.
        </p>
      </div>
    </div>

    <script>
      const SUPABASE_URL = "https://aqyypmswkyffnpsmqfwm.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxeXlwbXN3a3lmZm5wc21xZndtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDQ1MDUsImV4cCI6MjA5ODkyMDUwNX0.-0BF0z0l2aLF4nLc5qUWlAV7ypfwlGnMAtnX3--rEKo";
      const STREAM_ENDPOINT = "https://paychangu-webhook.xmradiomalawi.workers.dev/stream";

      let supabaseClient = null;
      let moviesCache = [];
      let selectedMovie = null;

      function escapeHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function formatPrice(price) {
        if (price === null || price === undefined || price === "") {
          return "Rent";
        }
        const amount = Number(price);
        if (!Number.isNaN(amount)) {
          return `$${amount.toFixed(2)}`;
        }
        return escapeHtml(price);
      }

      function renderMovieCards(items) {
        const grid = document.getElementById("movie-grid");
        const status = document.getElementById("catalog-status");

        if (!items || items.length === 0) {
          grid.innerHTML = `<li style="grid-column:1/-1;" class="text-sm text-muted">No matching movies found.</li>`;
          status.textContent = "0 movies";
          return;
        }

        status.textContent = `${items.length} ${items.length === 1 ? "movie" : "movies"}`;

        grid.innerHTML = items.map((movie) => {
          const title = escapeHtml(movie.title || "Untitled");
          const genre = escapeHtml(movie.Genre || "General");
          const language = escapeHtml(movie.Language || "N/A");
          const priceLabel = formatPrice(movie.rent_price);
          const encodedId = encodeURIComponent(String(movie.id ?? ""));
          const hasThumb = Boolean(movie.thumbnail_url && String(movie.thumbnail_url).trim());
          const thumbUrl = hasThumb ? escapeHtml(String(movie.thumbnail_url).trim()) : "";

          const rentAction = movie.paychangu_link
            ? `<a href="${escapeHtml(movie.paychangu_link)}" target="_blank" rel="noopener noreferrer" class="bt-btn bt-btn-rent">Rent</a>`
            : `<button type="button" onclick="openStreamModal('${encodedId}')" class="bt-btn bt-btn-rent">Rent</button>`;

          const trailerAction = movie.Trailer
            ? `<a href="${escapeHtml(movie.Trailer)}" target="_blank" rel="noopener noreferrer" class="bt-btn bt-btn-trailer">&#9654; Trailer</a>`
            : "";

          return `
            <li class="flex flex-col">
              <div class="frame block aspect-[2/3] overflow-hidden" style="background:#f3f4f6;">
                ${hasThumb
                  ? `<img alt="${title}" src="${thumbUrl}" loading="lazy" class="w-full h-full object-cover object-center" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" /><div class="bt-poster-fallback" style="display:none;">${title}</div>`
                  : `<div class="bt-poster-fallback">${title}</div>`
                }
              </div>

              <div class="flex items-start justify-between gap-3 mt-3">
                <div class="min-w-0">
                  <h3 class="font-serif text-[1.125rem] md:text-[1.25rem] leading-[1.1] tracking-[-0.01em] mb-0">
                    ${title}
                  </h3>
                  <p class="text-[0.8125rem] leading-[1.45] text-muted tabular-nums mt-1.5 mb-0">
                    ${genre} &bull; ${language}
                  </p>
                </div>
                <div class="shrink-0 text-end">
                  <p class="font-serif text-[1.375rem] md:text-[1.5rem] leading-none text-emphasis tabular-nums mb-0">
                    ${priceLabel}
                  </p>
                </div>
              </div>

              <div class="bt-actions">
                ${rentAction}
                ${trailerAction}
                <button type="button" onclick="openStreamModal('${encodedId}')" class="bt-btn bt-btn-watch">Watch</button>
              </div>
            </li>
          `;
        }).join("");
      }

      function handleMovieSearch(query) {
        const q = String(query || "").trim().toLowerCase();
        if (!q) {
          renderMovieCards(moviesCache);
          return;
        }
        const filtered = moviesCache.filter((m) =>
          (m.title || "").toLowerCase().includes(q) ||
          (m.Genre || "").toLowerCase().includes(q) ||
          (m.Language || "").toLowerCase().includes(q)
        );
        renderMovieCards(filtered);
      }

      function openStreamModal(encodedId, prefillTxRef = "") {
        const id = decodeURIComponent(encodedId);
        const movie = moviesCache.find((m) => String(m.id) === String(id)) || moviesCache[0];
        if (!movie) return;

        selectedMovie = movie;
        document.getElementById("stream-modal-title").textContent = movie.title || "Watch Movie";
        document.getElementById("tx-ref-input").value = prefillTxRef;
        document.getElementById("stream-status").textContent = "Enter a verified PayChangu transaction reference (tx_ref) to stream.";

        const player = document.getElementById("stream-player");
        player.pause();
        player.removeAttribute("src");
        player.load();

        document.getElementById("stream-modal").classList.add("open");

        if (prefillTxRef) {
          startStream(movie, prefillTxRef);
        }
      }

      function closeStreamModal() {
        const player = document.getElementById("stream-player");
        player.pause();
        player.removeAttribute("src");
        player.load();
        document.getElementById("stream-modal").classList.remove("open");
      }

      function unlockAndPlayStream() {
        const txRef = document.getElementById("tx-ref-input").value.trim();
        if (!selectedMovie) return;
        if (!txRef) {
          document.getElementById("stream-status").textContent = "Please enter your tx_ref first.";
          return;
        }
        startStream(selectedMovie, txRef);
      }

      function startStream(movie, txRef) {
        const player = document.getElementById("stream-player");
        const statusEl = document.getElementById("stream-status");
        const url = `${STREAM_ENDPOINT}?movie_id=${encodeURIComponent(movie.id)}&tx_ref=${encodeURIComponent(txRef)}`;

        statusEl.textContent = "Verifying payment and loading stream...";
        player.src = url;
        player.load();
        player.play().then(() => {
          statusEl.textContent = "Playing stream.";
        }).catch(() => {
          statusEl.textContent = "Stream ready — press play if needed.";
        });
      }

      async function loadMoviesFromSupabase() {
        const grid = document.getElementById("movie-grid");
        const status = document.getElementById("catalog-status");

        try {
          const lib = window.supabase || window.supabaseJS;
          if (!lib) throw new Error("Supabase client script did not load.");

          supabaseClient = lib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

          const { data, error } = await supabaseClient
            .from("movies")
            .select('id, title, "Genre", thumbnail_url, video_url, rent_price, "Language", "Trailer", paychangu_link');

          if (error) throw error;

          moviesCache = data || [];
          renderMovieCards(moviesCache);

          const params = new URLSearchParams(window.location.search);
          const returnTxRef = params.get("tx_ref") || params.get("reference");
          const returnMovieId = params.get("movie_id") || params.get("key");
          if (returnTxRef && (returnMovieId || moviesCache[0])) {
            openStreamModal(encodeURIComponent(returnMovieId || moviesCache[0].id), returnTxRef);
          }
        } catch (err) {
          console.error("Error loading movies:", err);
          status.textContent = "Error loading catalog";
          grid.innerHTML = `<li style="grid-column:1/-1;color:#b91c1c;" class="text-sm">Could not load movies from Supabase. Check public SELECT policy on movies.</li>`;
        }
      }

      loadMoviesFromSupabase();
    </script>
  </body>
