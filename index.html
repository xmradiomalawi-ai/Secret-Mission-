<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XM STUDIO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.0/dist/umd/supabase.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 32px 16px 64px;
            background-color: #ffffff;
            color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .page-shell {
            width: 100%;
            max-width: 780px;
            border: 2px solid #000000;
            background-color: #ffffff;
            padding: 24px 28px 40px;
        }
        .domain-pill {
            display: block;
            width: fit-content;
            margin: 0 auto 18px;
            padding: 6px 28px;
            border: 1.5px solid #000000;
            border-radius: 999px;
            font-size: 13px;
            color: #000000;
            text-decoration: none;
        }
        .brand-title {
            margin: 0 0 28px;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #000000;
        }
        .search-wrap {
            max-width: 340px;
            margin: 0 auto 28px;
        }
        .search-input {
            width: 100%;
            padding: 9px 14px;
            border: 1.5px solid #000000;
            border-radius: 999px;
            font-size: 13px;
            color: #000000;
            background: #ffffff;
            outline: none;
        }
        .catalog-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 44px;
        }
        .movie-block {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .poster-box {
            width: 130px;
            height: 175px;
            border: 1px solid #d4d4d8;
            background-color: #f4f4f5;
            overflow: hidden;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .poster-fallback {
            padding: 10px;
            font-size: 12px;
            font-weight: 700;
            color: #18181b;
            line-height: 1.3;
        }
        .meta-lines {
            font-size: 14px;
            line-height: 1.65;
            color: #000000;
            margin-bottom: 14px;
        }
        .meta-lines p {
            margin: 0;
        }
        .btn-stack {
            width: 100%;
            max-width: 185px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .pill-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: opacity 0.15s ease;
        }
        .pill-btn:hover {
            opacity: 0.9;
        }
        .btn-trailer {
            background-color: #ef2314;
            color: #000000;
        }
        .btn-rent {
            background-color: #6ce548;
            color: #000000;
        }
        .btn-watch {
            background-color: #000000;
            color: #ffffff;
            font-weight: 700;
            font-size: 12px;
            padding: 7px 14px;
        }
        .status-msg {
            text-align: center;
            font-size: 13px;
            color: #3f3f46;
            padding: 20px 0;
        }
        .error-msg {
            text-align: center;
            font-size: 13px;
            color: #b91c1c;
            padding: 20px 0;
        }

        /* Watch Modal */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 50;
        }
        .modal-backdrop.open {
            display: flex;
        }
        .modal-card {
            width: 100%;
            max-width: 560px;
            background: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            padding: 20px;
        }
        .modal-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .modal-title {
            margin: 0;
            font-size: 16px;
            font-weight: 800;
        }
        .close-btn {
            background: transparent;
            border: 1px solid #000000;
            color: #000000;
            font-weight: 700;
            padding: 4px 10px;
            cursor: pointer;
        }
        .modal-video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000;
            margin-bottom: 12px;
        }
        .tx-row {
            display: flex;
            gap: 8px;
        }
        .tx-input {
            flex: 1;
            padding: 8px 12px;
            border: 1.5px solid #000000;
            font-size: 13px;
        }
        .tx-submit {
            padding: 8px 14px;
            background: #6ce548;
            color: #000000;
            border: 1.5px solid #000000;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
        }
        .modal-status {
            margin: 8px 0 0;
            font-size: 12px;
            color: #3f3f46;
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="domain-pill" id="site-domain-pill">btvideo.pages.dev</div>
        <h1 class="brand-title">XM STUDIO</h1>

        <div class="search-wrap">
            <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="Search title, genre, or language..."
                oninput="handleSearch(this.value)"
            >
        </div>

        <div id="movie-catalog" class="catalog-list">
            <p class="status-msg">Loading catalog...</p>
        </div>
    </div>

    <!-- Stream Unlock Modal -->
    <div id="player-modal" class="modal-backdrop">
        <div class="modal-card">
            <div class="modal-top">
                <h2 id="player-movie-title" class="modal-title">Watch Movie</h2>
                <button type="button" class="close-btn" onclick="closePlayerModal()">Close</button>
            </div>
            <video id="stream-video" class="modal-video" controls playsinline></video>
            <div class="tx-row">
                <input
                    type="text"
                    id="tx-ref-input"
                    class="tx-input"
                    placeholder="Enter PayChangu tx_ref to play..."
                >
                <button type="button" class="tx-submit" onclick="loadStreamFromInput()">Play</button>
            </div>
            <p id="player-status" class="modal-status">Enter your PayChangu transaction reference (tx_ref) to unlock playback.</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://aqyypmswkyffnpsmqfwm.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxeXlwbXN3a3lmZm5wc21xZndtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDQ1MDUsImV4cCI6MjA5ODkyMDUwNX0.-0BF0z0l2aLF4nLc5qUWlAV7ypfwlGnMAtnX3--rEKo";
        const STREAM_WORKER_BASE = "https://paychangu-webhook.xmradiomalawi.workers.dev/stream";

        let supabaseClient = null;
        let cachedMovies = [];
        let activeMovie = null;

        document.getElementById("site-domain-pill").textContent = window.location.host || "btvideo.pages.dev";

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function formatRentButton(price) {
            if (price === null || price === undefined || price === "") {
                return "RENT";
            }
            const num = Number(price);
            if (!Number.isNaN(num)) {
                return `RENT : $${num.toFixed(2)}`;
            }
            return `RENT : ${escapeHtml(price)}`;
        }

        function renderMovies(moviesList) {
            const container = document.getElementById("movie-catalog");
            if (!moviesList || moviesList.length === 0) {
                container.innerHTML = `<p class="status-msg">No movies found.</p>`;
                return;
            }

            container.innerHTML = moviesList.map((movie) => {
                const title = escapeHtml(movie.title || "Untitled");
                const genre = escapeHtml(movie.Genre || "-");
                const language = escapeHtml(movie.Language || "-");
                const rentText = formatRentButton(movie.rent_price);
                const encodedId = encodeURIComponent(String(movie.id ?? ""));
                const hasThumb = Boolean(movie.thumbnail_url && String(movie.thumbnail_url).trim());
                const thumbUrl = hasThumb ? escapeHtml(String(movie.thumbnail_url).trim()) : "";

                const trailerHtml = movie.Trailer
                    ? `<a href="${escapeHtml(movie.Trailer)}" target="_blank" rel="noopener noreferrer" class="pill-btn btn-trailer">&#9654; TRAILER</a>`
                    : `<button type="button" onclick="alert('No trailer link set for this movie yet.')" class="pill-btn btn-trailer">&#9654; TRAILER</button>`;

                const rentHtml = movie.paychangu_link
                    ? `<a href="${escapeHtml(movie.paychangu_link)}" target="_blank" rel="noopener noreferrer" class="pill-btn btn-rent">${rentText}</a>`
                    : `<button type="button" onclick="openStreamModal('${encodedId}')" class="pill-btn btn-rent">${rentText}</button>`;

                return `
                    <article class="movie-block">
                        <div class="poster-box">
                            ${hasThumb
                                ? `<img src="${thumbUrl}" alt="${title}" class="poster-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span class="poster-fallback" style="display:none;">${title}</span>`
                                : `<span class="poster-fallback">${title}</span>`
                            }
                        </div>
                        <div class="meta-lines">
                            <p>Title : ${title}</p>
                            <p>Genre : ${genre}</p>
                            <p>Language : ${language}</p>
                        </div>
                        <div class="btn-stack">
                            ${trailerHtml}
                            ${rentHtml}
                            <button type="button" onclick="openStreamModal('${encodedId}')" class="pill-btn btn-watch">WATCH WITH tx_ref</button>
                        </div>
                    </article>
                `;
            }).join("");
        }

        function handleSearch(query) {
            const q = query.trim().toLowerCase();
            if (!q) {
                renderMovies(cachedMovies);
                return;
            }
            const filtered = cachedMovies.filter((m) =>
                (m.title || "").toLowerCase().includes(q) ||
                (m.Genre || "").toLowerCase().includes(q) ||
                (m.Language || "").toLowerCase().includes(q)
            );
            renderMovies(filtered);
        }

        function openStreamModal(encodedId, prefillTxRef = "") {
            const id = decodeURIComponent(encodedId);
            const movie = cachedMovies.find((m) => String(m.id) === String(id)) || cachedMovies[0];
            if (!movie) return;

            activeMovie = movie;
            document.getElementById("player-movie-title").textContent = movie.title || "Watch Movie";
            document.getElementById("tx-ref-input").value = prefillTxRef;
            document.getElementById("player-status").textContent = "Enter your PayChangu transaction reference (tx_ref) to unlock playback.";

            const videoEl = document.getElementById("stream-video");
            videoEl.pause();
            videoEl.removeAttribute("src");
            videoEl.load();

            document.getElementById("player-modal").classList.add("open");

            if (prefillTxRef) {
                startMovieStream(movie, prefillTxRef);
            }
        }

        function closePlayerModal() {
            const videoEl = document.getElementById("stream-video");
            videoEl.pause();
            videoEl.removeAttribute("src");
            videoEl.load();
            document.getElementById("player-modal").classList.remove("open");
        }

        function loadStreamFromInput() {
            const txRef = document.getElementById("tx-ref-input").value.trim();
            if (!activeMovie) return;
            if (!txRef) {
                document.getElementById("player-status").textContent = "Please enter a tx_ref first.";
                return;
            }
            startMovieStream(activeMovie, txRef);
        }

        function startMovieStream(movie, txRef) {
            const videoEl = document.getElementById("stream-video");
            const statusEl = document.getElementById("player-status");
            const streamUrl = `${STREAM_WORKER_BASE}?movie_id=${encodeURIComponent(movie.id)}&tx_ref=${encodeURIComponent(txRef)}`;

            statusEl.textContent = "Verifying payment and loading stream...";
            videoEl.src = streamUrl;
            videoEl.load();
            videoEl.play().then(() => {
                statusEl.textContent = "Playback started.";
            }).catch(() => {
                statusEl.textContent = "Stream ready — press play if needed.";
            });
        }

        async function loadCatalog() {
            try {
                const { data, error } = await supabaseClient
                    .from("movies")
                    .select('id, title, "Genre", thumbnail_url, video_url, rent_price, "Language", "Trailer", paychangu_link');

                if (error) throw error;
                cachedMovies = data || [];
                renderMovies(cachedMovies);

                const params = new URLSearchParams(window.location.search);
                const returnTxRef = params.get("tx_ref") || params.get("reference");
                const returnMovieId = params.get("movie_id") || params.get("key");
                if (returnTxRef && (returnMovieId || cachedMovies[0])) {
                    openStreamModal(encodeURIComponent(returnMovieId || cachedMovies[0].id), returnTxRef);
                }
            } catch (err) {
                console.error("Failed to load movies:", err);
                document.getElementById("movie-catalog").innerHTML =
                    `<p class="error-msg">Could not load movies. Check Supabase public read policy on movies.</p>`;
            }
        }

        function initApp() {
            const supabaseLib = window.supabase || window.supabaseJS;
            if (!supabaseLib) {
                document.getElementById("movie-catalog").innerHTML =
                    `<p class="error-msg">Supabase library failed to load.</p>`;
                return;
            }
            supabaseClient = supabaseLib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            loadCatalog();
        }

        initApp();
    </script>
</body>
</html>
