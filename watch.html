
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BT VIDEO — Watch</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
    }
    video {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>BT VIDEO</h1>
  <video id="player" controls playsinline controlsList="nodownload" oncontextmenu="return false;"></video>
  <p id="status">Checking your payment...</p>

  <script>
    const STREAM_ENDPOINT = "https://paychangu-webhook.xmradiomalawi.workers.dev/stream";

    const params = new URLSearchParams(window.location.search);
    const movieId = params.get("movie_id");
    const txRef = params.get("tx_ref");
    const player = document.getElementById("player");
    const statusText = document.getElementById("status");

    if (!movieId || !txRef) {
  statusText.textContent = "";
} else {
      player.addEventListener("loadedmetadata", () => {
        statusText.textContent = "Press play to watch.";
      });
      player.addEventListener("error", () => {
        statusText.textContent = "We could not load your movie. Refresh the page or contact BT VIDEO.";
      });
      player.src = STREAM_ENDPOINT +
        "?movie_id=" + encodeURIComponent(movieId) +
        "&tx_ref=" + encodeURIComponent(txRef);
    }
  </script>
</body>
</html>
